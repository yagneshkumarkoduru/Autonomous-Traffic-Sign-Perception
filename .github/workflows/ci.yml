name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/

      - name: Run Tier 3 Event-RGB Cross-Attention Benchmark
        run: |
          python implementations/v3_event_rgb_certified_fusion/event_stream_cross_attention.py

      - name: Run Tier 3 Neyman-Pearson Robustness Verifier
        run: |
          python implementations/v3_event_rgb_certified_fusion/neyman_pearson_robustness_verifier.py
